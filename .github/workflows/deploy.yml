name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # Navigate to project directory
          cd /var/www/dashboard

          # Pull latest code
          git pull origin main

          # Install Python dependencies
          pip3 install --break-system-packages fastapi uvicorn pandas openpyxl python-multipart

          # Build frontend
          cd /var/www/dashboard/frontend
          cat > .env.production << 'EOF'
          VITE_API_URL=http://72.61.103.174:8080
          EOF

          npm install
          npm run build
          cp -r dist/* /var/www/dashboard/frontend-dist/

          # Restart backend service
          systemctl restart dashboard-backend

          # Reload Nginx
          systemctl reload nginx

          echo "✅ Deployment complete!"
